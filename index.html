<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 할 일</title>
<style>
  /* 한 줄 레이아웃: 가운데 정렬된 단일 컬럼 카드 */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --fg: #1d2530;
    --muted: #6b7684;
    --line: #dde2e8;
    --accent: #2f6fdb;
    --accent-soft: #e4ecfb;
    --danger: #c94040;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13171c;
      --surface: #1c2229;
      --fg: #e6ebf0;
      --muted: #8b96a3;
      --line: #2c343d;
      --accent: #6b9cf0;
      --accent-soft: #23314a;
      --danger: #e57272;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    padding: 48px 16px;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.75rem; letter-spacing: -0.02em; }
  .date { color: var(--muted); font-size: 0.9rem; }

  form.add { display: flex; gap: 8px; }
  .add input {
    flex: 1; min-width: 0;
    padding: 12px 14px;
    font: inherit; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--fg);
  }
  .add input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button {
    font: inherit; cursor: pointer;
    border: 0; border-radius: 8px;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .add button { padding: 0 18px; background: var(--accent); color: #fff; font-weight: 600; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .filters { display: flex; gap: 4px; }
  .filters button { padding: 6px 12px; background: transparent; color: var(--muted); font-size: 0.9rem; }
  .filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: 0; }
  li input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
  .text { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.45; cursor: text; }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  .edit { flex: 1; min-width: 0; font: inherit; padding: 4px 6px; border: 1px solid var(--accent); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .del { background: transparent; color: var(--muted); padding: 4px 8px; font-size: 1.1rem; line-height: 1; opacity: 0; }
  li:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--danger); }
  @media (hover: none) { .del { opacity: 1; } }

  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  footer { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; }
  .clear { background: transparent; color: var(--muted); padding: 0; text-decoration: underline; font-size: 0.85rem; }
  .clear:hover { color: var(--danger); }
  .clear[disabled] { visibility: hidden; }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>오늘의 할 일</h1>
    <span class="date" id="date"></span>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <input id="newTodo" type="text" placeholder="할 일을 입력하고 Enter" maxlength="200" aria-label="새 할 일">
    <button type="submit">추가</button>
  </form>

  <section class="panel">
    <div class="toolbar">
      <div class="filters" role="group" aria-label="보기">
        <button type="button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-filter="active" aria-pressed="false">진행 중</button>
        <button type="button" data-filter="done" aria-pressed="false">완료</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden></div>
  </section>

  <footer>
    <span>더블클릭으로 수정 · 브라우저에 자동 저장</span>
    <button type="button" class="clear" id="clearDone">완료 항목 지우기</button>
  </footer>
</main>

<script>
  const KEY = "todo-app.items";
  let filter = "all";
  let todos = load();

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    return [
      { id: 1, text: "예시: 장보기 목록 정리하기", done: false },
      { id: 2, text: "예시: 보고서 초안 검토", done: true },
    ];
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {}
  }

  const $ = (id) => document.getElementById(id);
  const list = $("list");

  $("date").textContent = new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });

  function render() {
    const visible = todos.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
    list.replaceChildren(...visible.map(item));

    const left = todos.filter(t => !t.done).length;
    $("count").textContent = `남은 일 ${left}개 / 전체 ${todos.length}개`;
    $("clearDone").disabled = !todos.some(t => t.done);

    const empty = $("empty");
    empty.hidden = visible.length > 0;
    empty.textContent = todos.length === 0 ? "할 일이 없습니다. 위에서 추가해 보세요."
      : filter === "done" ? "완료한 일이 아직 없습니다." : "모든 일을 끝냈습니다.";
  }

  function item(t) {
    const li = document.createElement("li");
    li.className = t.done ? "done" : "";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.done;
    cb.setAttribute("aria-label", "완료 표시");
    cb.addEventListener("change", () => { t.done = cb.checked; save(); render(); });

    const span = document.createElement("span");
    span.className = "text";
    span.textContent = t.text;
    span.addEventListener("dblclick", () => startEdit(li, span, t));

    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "×";
    del.setAttribute("aria-label", "삭제");
    del.addEventListener("click", () => { todos = todos.filter(x => x.id !== t.id); save(); render(); });

    li.append(cb, span, del);
    return li;
  }

  function startEdit(li, span, t) {
    const input = document.createElement("input");
    input.className = "edit";
    input.value = t.text;
    input.maxLength = 200;
    let finished = false;
    const finish = (commit) => {
      if (finished) return;
      finished = true;
      const v = input.value.trim();
      if (commit) {
        if (v) t.text = v;
        else todos = todos.filter(x => x.id !== t.id);
        save();
      }
      render();
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    input.addEventListener("blur", () => finish(true));
    li.replaceChild(input, span);
    input.focus();
    input.select();
  }

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("newTodo");
    const text = input.value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now(), text, done: false });
    input.value = "";
    save();
    render();
  });

  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b === btn));
      render();
    });
  });

  $("clearDone").addEventListener("click", () => { todos = todos.filter(t => !t.done); save(); render(); });

  render();
</script>
</body>
</html>
